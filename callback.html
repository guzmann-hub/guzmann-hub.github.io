<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion TikTok - Lepanettes Clip</title>
<style>body{font:16px/1.6 system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;color:#1b1330;background:#faf8ff}h1{color:#6b2fc4}textarea{width:100%;height:110px;font:13px monospace;padding:8px;box-sizing:border-box}button{background:#6b2fc4;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:16px;cursor:pointer}.err{color:#b00020}</style></head>
<body>
<h1>Connexion TikTok</h1>
<p id="msg">Lecture de la réponse de TikTok…</p>
<textarea id="url" readonly></textarea>
<p><button id="copy" type="button">Copier l'adresse</button></p>
<p>Retourne dans Lepanettes Clip, colle cette adresse dans la case « 2. », puis clique sur « Valider la connexion ».</p>
<script>
var u=location.href, p=new URLSearchParams(location.search), m=document.getElementById('msg');
document.getElementById('url').value=u;
if(p.get('error')){m.className='err';m.textContent='TikTok a refusé : '+(p.get('error_description')||p.get('error'));}
else if(p.get('code')){m.textContent='Autorisation reçue. Copie l\'adresse ci-dessous.';}
else{m.className='err';m.textContent="Aucun code reçu : recommence depuis « 1. Autoriser sur TikTok ».";}
document.getElementById('copy').onclick=function(){var t=document.getElementById('url');t.select();try{navigator.clipboard.writeText(u)}catch(e){document.execCommand('copy')}this.textContent='Copié';};
</script>
</body></html>
